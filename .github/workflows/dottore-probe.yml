name: Dottore probe (temporary)

# Temporary isolation test: one plain call per effort level, no tools, on replay 1261's source diff.
# Delete after use.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replay/1261
          fetch-depth: 0
      - run: git fetch -q origin replay-base/1261
      - run: pip install -q openai
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          MODEL: ${{ vars.DOTTORE_MODEL }}
        shell: python
        run: |
          import os, subprocess, time
          from openai import OpenAI

          diff = subprocess.run(
              ["git", "diff", "-U20", "origin/replay-base/1261", "HEAD", "--", "*.ts", "*en.json"],
              capture_output=True, text=True, check=True,
          ).stdout
          message = subprocess.run(["git", "log", "-1", "--format=%B"], capture_output=True, text=True, check=True).stdout
          prompt = (
              "Review this pull request for correctness bugs introduced by the change: wrong results, "
              "broken invariants, settings or defaults that cannot behave as described, and mismatches "
              "between components. Think it through carefully. For each bug give the file and line, what "
              "goes wrong with a concrete example, and your confidence. Report only real bugs, not style.\n\n"
              f"Pull request description:\n{message}\n\nDiff:\n{diff}"
          )
          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"], base_url=os.environ.get("LLM_BASE_URL") or None)
          for effort in ("low", "xhigh"):
              started = time.time()
              text, usage, error = [], None, None
              try:
                  stream = client.chat.completions.create(
                      model=os.environ["MODEL"],
                      messages=[{"role": "user", "content": prompt}],
                      reasoning_effort=effort,
                      stream=True,
                      stream_options={"include_usage": True},
                      timeout=1500,
                  )
                  for chunk in stream:
                      if chunk.choices and chunk.choices[0].delta.content:
                          text.append(chunk.choices[0].delta.content)
                      if chunk.usage:
                          usage = chunk.usage
              except Exception as exc:
                  error = repr(exc)
              print(f"===== effort={effort} seconds={time.time() - started:.0f} error={error} =====", flush=True)
              print(f"usage: {usage.model_dump() if usage else None}", flush=True)
              print("".join(text), flush=True)
